<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 720px;">
    <h1 class="h3 mb-3" th:text="${movil.id == null} ? 'Nuevo móvil' : 'Editar móvil'">Móvil</h1>

    <form th:action="@{/moviles/guardar}" th:object="${movil}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="marca">Marca</label>
                <input type="text" id="marca" th:field="*{marca}" class="form-control"
                       th:classappend="${#fields.hasErrors('marca')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{marca}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="modelo">Modelo</label>
                <input type="text" id="modelo" th:field="*{modelo}" class="form-control"
                       th:classappend="${#fields.hasErrors('modelo')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{modelo}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="sistemaOperativo">Sistema operativo</label>
                <select id="sistemaOperativo" th:field="*{sistemaOperativo}" class="form-select"
                        th:classappend="${#fields.hasErrors('sistemaOperativo')} ? 'is-invalid'">
                    <option value="">-- Elige --</option>
                    <option th:each="s : ${sistemas}" th:value="${s}" th:text="${s.etiqueta}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{sistemaOperativo}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="pantalla">Pantalla</label>
                <select id="pantalla" th:field="*{pantalla}" class="form-select"
                        th:classappend="${#fields.hasErrors('pantalla')} ? 'is-invalid'">
                    <option value="">-- Elige --</option>
                    <option th:each="p : ${pantallas}" th:value="${p}" th:text="${p.etiqueta}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{pantalla}"></div>
            </div>

            <div class="col-md-4">
                <label class="form-label" for="ramGb">RAM (GB)</label>
                <input type="number" id="ramGb" th:field="*{ramGb}" class="form-control"
                       th:classappend="${#fields.hasErrors('ramGb')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{ramGb}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="almacenamientoGb">Almacenamiento (GB)</label>
                <input type="number" id="almacenamientoGb" th:field="*{almacenamientoGb}" class="form-control"
                       th:classappend="${#fields.hasErrors('almacenamientoGb')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{almacenamientoGb}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="anioLanzamiento">Año de lanzamiento</label>
                <input type="number" id="anioLanzamiento" th:field="*{anioLanzamiento}" class="form-control"
                       th:classappend="${#fields.hasErrors('anioLanzamiento')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{anioLanzamiento}"></div>
            </div>

            <div class="col-md-6">
                <label class="form-label" for="precio">Precio (€)</label>
                <input type="number" step="0.01" id="precio" th:field="*{precio}" class="form-control"
                       th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{precio}"></div>
            </div>
        </div>

        <div class="mt-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/moviles}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
