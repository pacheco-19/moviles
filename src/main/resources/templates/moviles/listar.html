<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Listado')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Móviles</h1>
        <a th:href="@{/moviles/nuevo}" class="btn btn-primary">+ Nuevo móvil</a>
    </div>

    <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Modelo</th>
                <th>Sistema</th>
                <th>Pantalla</th>
                <th>RAM</th>
                <th>Almac.</th>
                <th>Precio</th>
                <th>Año</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${moviles}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.marca}"></td>
                <td th:text="${m.modelo}"></td>
                <td th:text="${m.sistemaOperativo.etiqueta}"></td>
                <td th:text="${m.pantalla.etiqueta}"></td>
                <td th:text="${m.ramGb} + ' GB'"></td>
                <td th:text="${m.almacenamientoGb} + ' GB'"></td>
                <td th:text="${#numbers.formatDecimal(m.precio, 1, 'POINT', 2, 'COMMA')} + ' €'"></td>
                <td th:text="${m.anioLanzamiento}"></td>
                <td class="text-end">
                    <a th:href="@{/moviles/editar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-secondary">Editar</a>
                    <form th:action="@{/moviles/eliminar/{id}(id=${m.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Eliminar este móvil?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(moviles)}">
                <td colspan="10" class="text-center text-muted">No hay móviles registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
