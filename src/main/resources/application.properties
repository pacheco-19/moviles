spring.application.name=moviles
server.port=8082

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/moviles_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA: las tablas las crea schema.sql, no Hibernate ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Ejecuta schema.sql y data.sql al arrancar ---
spring.sql.init.mode=always

# --- Credenciales locales (archivo opcional, ignorado por git) ---
spring.config.import=optional:classpath:application-local.properties